# : Manager [[[

[mgr]
cwd = { fg = "#e6e2d5" }

# Tab
tab_active = { fg = "#333200", bg = "#cdca75", bold = true }
tab_inactive = { fg = "#eae68e", bg = "#1d1d00" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#72d4a5", bg = "#72d4a5" }
marker_cut = { fg = "#c0ecd7", bg = "#c0ecd7" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a5d0bc", bg = "#a5d0bc" }

# Count
count_copied = { fg = "#002116", bg = "#c0ecd7" }
count_cut = { fg = "#002116", bg = "#c0ecd7" }
count_selected = { fg = "#333200", bg = "#a5d0bc" }

# Border
border_symbol = " "
border_style  = { fg = "#cdca75" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#333200", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#cdca75", fg = "#333200", bold = true }
normal_alt  = { bg = "#48473a", fg = "#cac7b6" }

# Select mode
select_main = { bg = "#cbc8a4", fg = "#323118", bold = true }
select_alt  = { bg = "#48473a", fg = "#cac7b6" }

# Unset mode
unset_main = { bg = "#a5d0bc", fg = "#0c3729", bold = true }
unset_alt  = { bg = "#48473a", fg = "#cac7b6" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#cdca75", bg = "#3a3930" }
progress_error = { fg = "#ffb4ab", bg = "#3a3930" }

# Permissions
permissions_t = { fg = "#88844e" }
permissions_w = { fg = "#4b9170" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#4ac98c" }
permissions_s = { fg = "#bcb523" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#cdca75" }
active = { fg = "#a5d0bc", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#cdca75" }
value = { fg = "#e6e2d5" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#cdca75", bold = true, bg = "#14140c" }
inactive = { fg = "#cbc8a4", bg = "#14140c" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#cdca75", bg = "#333200" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#cdca75" }
title = {}
hovered = { fg = "#c0ecd7", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3a3930" }
cand = { fg = "#cdca75" }
rest = { fg = "#333200" }
desc = { fg = "#e6e2d5" }
separator = " ▶ "
separator_style = { fg = "#e6e2d5" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e6e2d5" }
run = { fg = "#e6e2d5" }
footer = { fg = "#323118", bg = "#cbc8a4" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#a5d0bc" }
title_warn = { fg = "#cdca75" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#e6e2d5" },
    { name = "*/", fg = "#cdca75" },
]

# : ]]]
