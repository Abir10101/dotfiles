# ─────────────────────────────────────────────
# GAPS
# gappih/gappiv = inner horizontal/vertical gaps
# gappoh/gappov = outer horizontal/vertical gaps
# ─────────────────────────────────────────────
gappih=8
gappiv=8
gappoh=5
gappov=5

# ─────────────────────────────────────────────
# BORDER
# ─────────────────────────────────────────────
borderpx=3

# ─────────────────────────────────────────────
# BLUR
# Blur is only visible on windows/surfaces that have transparency.
# blur_layer=1 enables blur behind layershell surfaces (waybar, rofi, etc.)
# ─────────────────────────────────────────────
blur=1
blur_optimized=1
blur_layer=1
blur_params_radius=8
blur_params_num_passes=2
blur_params_noise=0.15
blur_params_brightness=0.9
blur_params_contrast=2
blur_params_saturation=1.2

# ─────────────────────────────────────────────
# SHADOWS
# shadows_blur ≈ softness; shadows_size ≈ spread
# shadow_only_floating=1 applies shadows to all windows, not just floating ones
# ─────────────────────────────────────────────
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=15
shadows_blur=20
shadows_position_x=0
shadows_position_y=6

# ─────────────────────────────────────────────
# SCROLLER LAYOUT
# Scrollable tiling with preset widths 0.3, 0.5, 0.7, 1.0
# ─────────────────────────────────────────────

# Apply scroller layout to all 9 tags
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

scroller_default_proportion=1.0

# Center focused window when it overflows the visible area
scroller_prefer_center=1
scroller_focus_center=0
scroller_prefer_overspread=0

# Width cycle presets
scroller_proportion_preset=0.3,0.5,0.7,1.0

# Single window always fills full width
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0

# ─────────────────────────────────────────────
# WINDOW RULES
# ─────────────────────────────────────────────
windowrule=isfloating:1,appid:pavucontrol
