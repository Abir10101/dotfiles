# keybindings.conf
# Place at: ~/.config/mango/keybindings.conf

# --- Overview ---
bind=SUPER,o,toggleoverview

# --- Screenshot (grim + slurp) ---
bind=SUPER+CTRL,p,spawn_shell,grim -g "$(slurp)" ~/pictures/screenshot_$(date +%Y_%m_%d_%H_%M_%S).png

# --- Application Launchers ---
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn_shell,~/.config/mango/scripts/appmenu.sh
bind=SUPER,p,spawn_shell,~/.config/mango/scripts/powermenu.sh
bind=SUPER,s,spawn_shell,~/.config/mango/scripts/audioswitch.sh
bind=SUPER,v,spawn_shell,~/.config/mango/scripts/clipmenu.sh

# --- Window Focus ---
bind=SUPER,j,focusdir,left
bind=SUPER,k,focusdir,right

# --- Move Window ---
bind=SUPER+SHIFT,j,exchange_client,left
bind=SUPER+SHIFT,k,exchange_client,right

# --- Float Toggle ---
bind=SUPER,f,togglefloating

# --- Close Window ---
bind=SUPER,w,killclient

# --- Cycle Width Preset ---
bind=SUPER+CTRL,r,switch_proportion_preset

# --- Tag Navigation (J/K = previous/next tag) ---
# bind=SUPER,j,viewtoleft
# bind=SUPER,k,viewtoright

# Move window to previous/next tag
# bind=SUPER+SHIFT,j,tagtoleft
# bind=SUPER+SHIFT,k,tagtoright

# Switch to tag 1–9
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move window to tag 1–9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# --- Config ---
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+CTRL,q,quit

# --- Media / Volume ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

# --- Mouse Floating Window Management ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
