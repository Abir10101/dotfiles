source=~/.config/mango/colors.conf
source=~/.config/mango/keybindings.conf
source=~/.config/mango/windowrule.conf
source=~/.config/mango/animation.conf

# ─────────────────────────────────────────────
# KEYBOARD
# ─────────────────────────────────────────────
numlockon=1

# ─────────────────────────────────────────────
# FOCUS
# ─────────────────────────────────────────────
sloppyfocus=0
warpcursor=0

# ─────────────────────────────────────────────
# TOUCHPAD
# ─────────────────────────────────────────────
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1
# accel_speed=0.0
# send_events_mode=1

# ─────────────────────────────────────────────
# MONITOR
# ─────────────────────────────────────────────
monitorrule=name:^DP-1$,width:1366,height:768,refresh:60,scale:1,x:1280,y:0,rr:0

# ─────────────────────────────────────────────
# AUTOSTART
# Note: update the path below if your scripts live elsewhere.
# DISPLAY is set automatically by MangoWM's built-in XWayland — do not hardcode it.
# ─────────────────────────────────────────────
exec-once=~/.config/mango/init_system.sh
