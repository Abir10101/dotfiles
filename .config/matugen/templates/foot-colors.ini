# -*- conf -*-
# Matugen Generated Colors for Foot Terminal
# Material You Dynamic Colors

[colors]

# Base Colors
background={{colors.surface.dark.hex_stripped}}
foreground={{colors.on_surface_variant.dark.hex_stripped}}

# Cursor colors (background foreground)
cursor={{colors.on_primary_fixed.dark.hex_stripped}} {{colors.primary_fixed_dim.dark.hex_stripped}}

# Selection colors
selection-foreground={{colors.on_secondary_container.dark.hex_stripped}}
selection-background={{colors.secondary_container.dark.hex_stripped}}

# Regular colors (0-7)
regular0={{colors.surface_container_high.dark.hex_stripped}}    # black (Surface Container High)
regular1={{colors.error_container.dark.hex_stripped}}                     # red (Error)
regular2={{colors.secondary.dark.hex_stripped}}                 # green (Secondary - muted slate)
regular3={{colors.tertiary_container.dark.hex_stripped}}        # yellow (Tertiary Container - muted gold)
regular4={{colors.primary.dark.hex_stripped}}                   # blue (Primary)
regular5={{colors.tertiary.dark.hex_stripped}}                  # magenta (Tertiary - muted iris)
regular6={{colors.primary_container.dark.hex_stripped}}         # cyan (Primary Container - muted blue)
regular7={{colors.on_surface_variant.dark.hex_stripped}}        # white (On Surface Variant)

# Bright colors (8-15)
bright0={{colors.outline.dark.hex_stripped}}                    # bright black (Outline)
bright1={{colors.on_error_container.dark.hex_stripped}}            # bright red (Error Container)
bright2={{colors.secondary_fixed_dim.dark.hex_stripped}}        # bright green (Secondary Fixed Dim)
bright3={{colors.tertiary_fixed_dim.dark.hex_stripped}}         # bright yellow (Tertiary Fixed Dim)
bright4={{colors.primary_fixed_dim.dark.hex_stripped}}          # bright blue (Primary Fixed Dim)
bright5={{colors.on_tertiary_container.dark.hex_stripped}}      # bright magenta (On Tertiary Container)
bright6={{colors.on_primary_container.dark.hex_stripped}}       # bright cyan (On Primary Container)
bright7={{colors.on_surface.dark.hex_stripped}}                 # bright white (On Surface)

# Flash color (for bell/alerts)
flash={{colors.tertiary_fixed_dim.dark.hex_stripped}}
