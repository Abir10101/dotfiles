# colors.conf
# Auto-generated by matugen — do not edit by hand.
# Regenerate with: matugen image /path/to/wallpaper.jpg
# Place at: ~/.config/mango/colors.conf

# ─────────────────────────────────────────────
# BORDER COLORS
# Format: 0xRRGGBBAA
# ─────────────────────────────────────────────
focuscolor=0x{{colors.primary_container.default.hex_stripped}}ff
bordercolor=0x{{colors.surface_container.default.hex_stripped}}ff
urgentcolor=0x{{colors.error_container.default.hex_stripped}}ff

# ─────────────────────────────────────────────
# SHADOW COLOR
# ─────────────────────────────────────────────
shadowscolor=0x{{colors.surface_container_lowest.default.hex_stripped}}cc

# ─────────────────────────────────────────────
# WINDOW OPACITY
# Required for blur to be visible on windows.
# ─────────────────────────────────────────────
focused_opacity=0.85
unfocused_opacity=0.8
