# --- UI Elements ---

# Main background and foreground
"ui.background" = { bg = "{{ colors.surface.default.hex }}" }
"ui.text" = { fg = "{{ colors.on_surface.default.hex }}" }
"ui.text.focus" = { fg = "{{ colors.on_primary.default.hex }}" }

# Line numbers
"ui.linenr" = { fg = "{{ colors.outline.default.hex }}" }
"ui.linenr.selected" = { fg = "{{ colors.primary.default.hex }}" }

# Statusline - cleaner with better hierarchy
"ui.statusline" = { 
  fg = "{{ colors.on_surface_variant.default.hex }}", 
  bg = "{{ colors.surface_container_lowest.default.hex }}"
}
"ui.statusline.inactive" = { 
  fg = "{{ colors.outline.default.hex }}", 
  bg = "{{ colors.surface_container_low.default.hex }}"
}
"ui.statusline.normal" = { 
  fg = "{{ colors.on_primary.default.hex }}", 
  bg = "{{ colors.primary.default.hex }}"
}
"ui.statusline.insert" = { 
  fg = "{{ colors.on_secondary.default.hex }}", 
  bg = "{{ colors.secondary.default.hex }}"
}
"ui.statusline.select" = { 
  fg = "{{ colors.on_tertiary.default.hex }}", 
  bg = "{{ colors.tertiary.default.hex }}"
}

# Popups and menus - better contrast
"ui.popup" = { 
  fg = "{{ colors.on_surface.default.hex }}", 
  bg = "{{ colors.surface_container_high.default.hex }}" 
}
"ui.menu" = { 
  fg = "{{ colors.on_surface.default.hex }}", 
  bg = "{{ colors.surface_container_highest.default.hex }}" 
}
"ui.menu.selected" = { 
  fg = "{{ colors.on_primary_container.default.hex }}", 
  bg = "{{ colors.primary_container.default.hex }}" 
}
"ui.help" = { 
  fg = "{{ colors.on_surface.default.hex }}", 
  bg = "{{ colors.surface_container_high.default.hex }}" 
}

# Window separator
"ui.window" = { bg = "{{ colors.surface_container.default.hex }}" }

# Selection and cursor
"ui.selection" = { bg = "{{ colors.primary_container.default.hex }}" }
"ui.selection.primary" = { bg = "{{ colors.primary.default.hex }}" }
"ui.cursor" = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
"ui.cursor.match" = { fg = "{{ colors.on_secondary_container.default.hex }}", bg = "{{ colors.secondary_container.default.hex }}" }
"ui.cursorline" = { bg = "{{ colors.surface_container_low.default.hex }}" }

# Gutter and diagnostics
"ui.gutter" = { bg = "{{ colors.surface.default.hex }}" }
"diagnostic.error" = { fg = "{{ colors.error.default.hex }}" }
"diagnostic.warning" = { fg = "{{ colors.secondary.default.hex }}" }
"diagnostic.info" = { fg = "{{ colors.tertiary.default.hex }}" }
"diagnostic.hint" = { fg = "{{ colors.outline.default.hex }}" }

# --- Syntax Highlighting ---

# Keywords - primary color for flow control
"keyword" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold"] }
"keyword.control" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold"] }
"keyword.control.conditional" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold", "italic"] }
"keyword.control.import" = { fg = "{{ colors.primary_fixed_dim.default.hex }}" }
"keyword.control.repeat" = { fg = "{{ colors.primary.default.hex }}" }

# Functions and methods - secondary color
"function" = { fg = "{{ colors.secondary.default.hex }}" }
"function.method" = { fg = "{{ colors.secondary.default.hex }}" }
"function.macro" = { fg = "{{ colors.tertiary.default.hex }}" }
"function.builtin" = { fg = "{{ colors.secondary_fixed_dim.default.hex }}" }

# Types - tertiary color
"type" = { fg = "{{ colors.tertiary.default.hex }}", modifiers = ["bold"] }
"type.builtin" = { fg = "{{ colors.tertiary_fixed_dim.default.hex }}" }

# Constants and literals
"constant" = { fg = "{{ colors.primary_fixed_dim.default.hex }}" }
"constant.builtin" = { fg = "{{ colors.tertiary.default.hex }}" }
"constant.numeric" = { fg = "{{ colors.tertiary.default.hex }}" }
"constant.character" = { fg = "{{ colors.tertiary.default.hex }}" }
"constant.character.escape" = { fg = "{{ colors.tertiary_fixed_dim.default.hex }}" }

# Variables
"variable" = { fg = "{{ colors.on_surface.default.hex }}" }
"variable.builtin" = { fg = "{{ colors.error.default.hex }}" }
"variable.parameter" = { fg = "{{ colors.on_surface_variant.default.hex }}", modifiers = ["italic"] }
"variable.other.member" = { fg = "{{ colors.secondary.default.hex }}" }

# Strings - using a warm color from the palette
"string" = { fg = "{{ colors.error_container.default.hex }}" }  # Using error_container as a warm color
"string.special" = { fg = "{{ colors.error.default.hex }}" }
"string.regexp" = { fg = "{{ colors.tertiary.default.hex }}" }

# Punctuation and operators
"punctuation" = { fg = "{{ colors.outline.default.hex }}" }
"punctuation.delimiter" = { fg = "{{ colors.outline.default.hex }}" }
"punctuation.bracket" = { fg = "{{ colors.outline.default.hex }}" }
"operator" = { fg = "{{ colors.primary.default.hex }}" }

# Comments
"comment" = { fg = "{{ colors.outline.default.hex }}", modifiers = ["italic"] }

# Tags and attributes (for markup languages)
"tag" = { fg = "{{ colors.primary.default.hex }}" }
"attribute" = { fg = "{{ colors.secondary.default.hex }}" }

# --- Markup/Text ---
"markup.heading" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold"] }
"markup.heading.1" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold"] }
"markup.heading.2" = { fg = "{{ colors.primary_fixed_dim.default.hex }}", modifiers = ["bold"] }
"markup.heading.3" = { fg = "{{ colors.secondary.default.hex }}", modifiers = ["bold"] }
"markup.list" = { fg = "{{ colors.tertiary.default.hex }}" }
"markup.bold" = { fg = "{{ colors.primary.default.hex }}", modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { fg = "{{ colors.outline.default.hex }}", modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "{{ colors.secondary.default.hex }}", modifiers = ["underlined"] }
"markup.link.text" = { fg = "{{ colors.primary.default.hex }}" }
"markup.raw" = { fg = "{{ colors.error_container.default.hex }}" }

# --- Diff ---
"diff.plus" = { fg = "{{ colors.secondary.default.hex }}" }
"diff.minus" = { fg = "{{ colors.error.default.hex }}" }
"diff.delta" = { fg = "{{ colors.tertiary.default.hex }}" }

# --- Special ---
"ui.highlight" = { bg = "{{ colors.surface_variant.default.hex }}" }
"ui.text.added" = { fg = "{{ colors.secondary.default.hex }}" }
"ui.text.changed" = { fg = "{{ colors.tertiary.default.hex }}" }
"ui.text.removed" = { fg = "{{ colors.error.default.hex }}" }
