---
- name: Install system packages
  hosts: localhost
  gather_facts: false
  vars:
    librewolf_dir: "{{ ansible_env.HOME }}/.librewolf"
    dotfiles_dir: "{{ ansible_env.HOME }}/dotfiles"
  tasks:
    - name: Create .librewolf directory
      ansible.builtin.file:
        path: "{{ librewolf_dir }}"
        state: directory
        mode: '0700'
    - name: Stow dotfiles
      ansible.builtin.command:
        chdir: "{{ dotfiles_dir }}"
        cmd: stow --adopt .
