---
- name: Install markdown language server marksman
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    marksman_url: "https://github.com/artempyanykh/marksman/releases/latest/download/marksman-linux-x64"
    download_dir: "/tmp"
    install_dir: "/usr/local/bin"

  tasks:
    - name: Check install directory exists
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: "directory"
        mode: "0755"
      tags:
        - setup

    - name: Download marksman binary
      ansible.builtin.get_url:
        url: "{{ marksman_url }}"
        dest: "{{ download_dir }}/marksman"
        mode: "0644"
      tags:
        - download

    - name: Move marksman binary to install directory
      ansible.builtin.copy:
        src: "{{ download_dir }}/marksman"
        dest: "{{ install_dir }}/marksman"
        mode: "0755"
        remote_src: true
      tags:
        - install

    - name: Cleanup downloaded files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ download_dir }}/marksman"
      tags:
        - cleanup
