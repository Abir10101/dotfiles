---
- name: Install c/c++ language server clangd
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    clangd_version: "20.1.8"
    clangd_url: "https://github.com/clangd/clangd/releases/download/{{ clangd_version }}/clangd-linux-{{ clangd_version }}.zip"
    download_dir: "/tmp"
    install_dir: "/usr/local/bin"

  tasks:
    - name: Check install directory exists
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: "directory"
        mode: "0755"
      tags:
        - setup

    - name: Download clangd archive
      ansible.builtin.get_url:
        url: "{{ clangd_url }}"
        dest: "{{ download_dir }}/clangd.zip"
        mode: "0644"
      tags:
        - download

    - name: Extract clangd archive
      ansible.builtin.unarchive:
        src: "{{ download_dir }}/clangd.zip"
        dest: "{{ download_dir }}"
        remote_src: true
      tags:
        - extract

    - name: Move clangd binary to install directory
      ansible.builtin.copy:
        src: "{{ download_dir }}/clangd_{{ clangd_version }}/bin/clangd"
        dest: "{{ install_dir }}/clangd"
        mode: "0755"
        remote_src: true
      tags:
        - install

    - name: Cleanup downloaded files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ download_dir }}/clangd.zip"
        - "{{ download_dir }}/clangd_{{ clangd_version }}.zip"
      tags:
        - cleanup
